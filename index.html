<style>
/* ==========================================================================
   Charte commune des applis — v1 (1er novembre 2026)
   À coller en haut du <style> de chaque index.html (pas de fichier externe :
   chaque appli reste un seul index.html). Voir charte.md pour les règles.
   Polices : copier design/fonts/ dans le dossier fonts/ de l'appli.
   ========================================================================== */

@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('fonts/fredoka-latin.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }

/* ---------- 1. Jetons (couleurs, formes, polices) ---------- */
:root {
  color-scheme: light dark;

  /* Fond et surfaces */
  --bg: #FFF4FA;            /* haut du dégradé de fond (rose très pâle) */
  --bg2: #EEF4FF;           /* bas du dégradé (bleu très pâle) */
  --surface: #FFFFFF;       /* cartes, bulles, boutons doux */
  --surface2: #F4F1FF;      /* touches du clavier, zones calmes */
  --track: #E4DEF7;         /* fond des barres de progression */

  /* Encre : même violet nuit que le contour des 30 personnages */
  --ink: #2B2340;           /* texte */
  --muted: #6B6190;         /* texte secondaire */
  --line: #2B2340;          /* contours et ombres dures */

  /* Rôles de couleur (un rôle = une couleur, dans toutes les applis) */
  --action: #3B5BFF;        /* LE bouton principal (Commencer, Valider, Suivant) */
  --on-action: #FFFFFF;
  --pompon: #FF6FA5;        /* rose de Pompon : cœurs, « Nouveau », bouton ▶ de l'accueil */
  --on-pompon: #FFFFFF;
  --sun: #FFD45C;           /* étoiles, récompenses, astuces, focus clavier */
  --on-sun: #2B2340;
  --good: #2BC48A;          /* bonne réponse, OK */
  --on-good: #0B2E20;
  --tint-good: #D8F6E8;     /* carte réussie */
  --retry: #FFB38A;         /* « à retenter » (jamais de rouge) */
  --tint-retry: #FFE4D6;    /* carte à retenter */

  /* 6 pastels (pastilles A-F, cartes de l'accueil, zones de carte) */
  --p-rose: #FFD2E3;
  --p-soleil: #FFE9A3;
  --p-menthe: #C6F1E2;
  --p-lilas: #E0D6FF;
  --p-ciel: #CDEBFF;
  --p-peche: #FFDCC8;

  /* 6 couleurs vives (icônes, personnages, confettis) */
  --v-rose: #FF6FA5;
  --v-soleil: #FFD45C;
  --v-menthe: #8EE3C8;
  --v-lilas: #C9B6FF;
  --v-ciel: #9AD7FF;
  --v-peche: #FFB38A;

  /* Lecture (applis de français) */
  --syl-a: #2F4FE0;         /* syllabes alternées : bleu… */
  --syl-b: #C92A62;         /* …et framboise */
  --muette: #A39DB8;        /* lettre muette grisée */
  --son-cle: #FFE9A3;       /* fond de la lettre qui décide du son */
  --ligne-b: #EEF1FF;       /* une ligne sur deux */

  /* Polices */
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;  /* titres, boutons, chiffres */
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; /* texte */
  --lecture: 'Nunito', Arial, sans-serif;                        /* texte à lire */

  /* Formes */
  --bord: 3px;
  --r-carte: 28px;
  --r-btn: 22px;
  --r-touche: 18px;
  --r-pastille: 999px;
  --ombre: 0 5px 0 var(--line);
  --ombre-carte: 0 6px 0 var(--line);
  --toucher: 56px;          /* hauteur mini d'un bouton */

  /* Mouvement */
  --ressort: cubic-bezier(.3, 1.6, .5, 1);
  --deco: .55;              /* opacité des petits dessins de fond */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1933;
    --bg2: #171B36;
    --surface: #2B2448;
    --surface2: #352D57;
    --track: #3D3466;
    --ink: #FBEFFF;
    --muted: #C3B7E8;
    --line: #120E22;        /* le contour reste sombre, même la nuit */
    --action: #7F98FF;
    --on-action: #120E22;
    --pompon: #FF8DB9;
    --on-pompon: #2A0F1E;
    --good: #3DDC97;
    --tint-good: #1D4A3D;
    --retry: #FF9F7A;
    --tint-retry: #5A3326;
    --p-rose: #5A3552;
    --p-soleil: #5A4A24;
    --p-menthe: #24504A;
    --p-lilas: #433A72;
    --p-ciel: #283F68;
    --p-peche: #5A3A2E;
    --syl-a: #9DB0FF;
    --syl-b: #FF8DB4;
    --muette: #7D7499;
    --son-cle: #5A4A24;
    --ligne-b: #262046;
    --deco: .25;
  }
}

/* ---------- 2. Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg2); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
h2 { font-size: 1.4rem; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 3. En-tête commun : 🏠 · titre · ⚙ ---------- */
.entete { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.entete .titre { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center; }
.rond {                    /* bouton rond (🏠, ⚙, ✕, son) */
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.rond:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 4. Boutons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: var(--toucher); padding: 10px 22px;
  font: 600 1.2rem var(--display); text-decoration: none;
  color: var(--ink); background: var(--surface);
  border: var(--bord) solid var(--line); border-radius: var(--r-btn);
  box-shadow: var(--ombre); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--ombre); }
.btn-action { background: var(--action); color: var(--on-action); }   /* un seul par écran */
.btn-soleil { background: var(--sun); color: var(--on-sun); }         /* bonus, installer */
.btn-ok { background: var(--good); color: var(--on-good); }
.btn-petit { width: auto; min-height: 44px; padding: 6px 16px; font-size: 1rem; border-radius: var(--r-pastille); box-shadow: 0 4px 0 var(--line); }

/* ---------- 5. Cartes, bulles, pastilles ---------- */
.carte {
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 20px;
}
.carte.reussie { background: var(--tint-good); }
.carte.a-retenter { background: var(--tint-retry); }
.bulle {                   /* bulle de dialogue d'un personnage */
  position: relative; background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: 26px; box-shadow: var(--ombre); padding: 12px 16px;
}
.pastille {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px;
  border: 2px solid var(--line); border-radius: var(--r-pastille);
  background: var(--surface); font: 700 .9rem var(--body); white-space: nowrap;
}
.pastille.soleil { background: var(--p-soleil); }
.pastille.rose { background: var(--p-rose); }
.pastille.menthe { background: var(--p-menthe); }
.badge-nouveau {
  display: inline-block; background: var(--sun); color: var(--on-sun);
  border: var(--bord) solid var(--line); border-radius: var(--r-pastille);
  padding: 1px 10px 2px; font: 700 .85rem var(--display); transform: rotate(4deg);
}
.etiquette { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.astuce {
  background: var(--sun); color: var(--on-sun); border-radius: 18px;
  padding: 10px 14px; font-weight: 700;
}
.astuce::before { content: '💡 '; }

/* ---------- 6. Progression ---------- */
.barre { height: 18px; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); overflow: hidden; }
.barre > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: inherit; transition: width .4s var(--ressort); }

/* ---------- 7. Choix A-F (QCM) et clavier ---------- */
.choix {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--toucher);
  padding: 8px 14px; text-align: left; font: 600 1.1rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.choix:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choix .lettre {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 10px; font-size: .9rem; background: var(--p-lilas);
}
.choix:nth-child(6n+1) .lettre { background: var(--p-rose); }
.choix:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.choix:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.choix:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.choix:nth-child(6n+5) .lettre { background: var(--p-peche); }
.choix:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.choix.bon { background: var(--tint-good); }
.choix.a-revoir { background: var(--tint-retry); }
.touche {
  min-height: 64px; font: 600 1.8rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.touche.douce { background: var(--surface2); }
.touche.ok { background: var(--good); color: var(--on-good); }

/* ---------- 8. Réglages : interrupteur ---------- */
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toucher); font-weight: 700; cursor: pointer; }
.interrupteur input { appearance: none; flex: none; width: 58px; height: 34px; margin: 0; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); position: relative; cursor: pointer; transition: background .2s; }
.interrupteur input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: transform .2s var(--ressort); }
.interrupteur input:checked { background: var(--good); }
.interrupteur input:checked::after { transform: translateX(24px); }

/* ---------- 9. Texte à lire (applis de français) ---------- */
.texte-lecture {
  font-family: var(--lecture); font-size: 22px; font-weight: 600; line-height: 2;
  letter-spacing: .02em; word-spacing: .12em; max-width: 34ch;
}
.texte-lecture .ligne { display: block; padding: 0 10px; border-radius: 10px; }
.texte-lecture .ligne:nth-child(even) { background: var(--ligne-b); }
.syl-a { color: var(--syl-a); }
.syl-b { color: var(--syl-b); }
.muette { color: var(--muette); }
.son-cle { background: var(--son-cle); border-radius: 6px; box-shadow: 0 0 0 2px var(--son-cle); }

/* ---------- 10. Animations (désactivables) ---------- */
@keyframes apparait { from { transform: scale(.85); opacity: 0; } }
@keyframes bravo { 0% { transform: scale(1); } 30% { transform: scale(1.08) rotate(-2deg); } 55% { transform: scale(.97) rotate(1deg); } 80% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes non { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(3px) rotate(.5deg); } }
@keyframes saute { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.06, .94); } 82% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes flotte { 50% { transform: translateY(-12px) rotate(12deg); } }
@keyframes etoile { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -80px)) scale(1) rotate(160deg); opacity: 0; } }
@keyframes arrive { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 60% { transform: translateY(-8px) scale(1.05); opacity: 1; } 100% { transform: none; } }

.anim-apparait { animation: apparait .45s var(--ressort) both; }
.anim-bravo { animation: bravo .6s ease both; }          /* bonne réponse : la carte rebondit */
.anim-non { animation: non .5s ease both; }              /* erreur : la carte secoue la tête */
.anim-saute { animation: saute 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.anim-arrive { animation: arrive .7s var(--ressort) both; } /* entrée d'un personnage */

/* Petits dessins de fond ★ ♥ ✿ ✦ */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--deco); }
.deco span { position: absolute; font-size: 22px; animation: flotte 7s ease-in-out infinite; }

/* Interrupteur « Animations » de l'appli : <html class="calme"> */
.calme *, .calme *::before, .calme *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   Simple ou complexe ? : styles propres à l'appli
   ========================================================================== */
[hidden] { display: none !important; }
.wrap { position: relative; z-index: 1; }
body.jeu .wrap { height: 100dvh; display: flex; flex-direction: column; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
body.jeu .entete { margin-bottom: 6px; }
body.jeu .entete .rond { width: 42px; height: 42px; font-size: 19px; }
body.jeu .deco { display: none; }
.vue { animation: apparait .35s var(--ressort) both; }
.pile { display: grid; gap: 14px; }
.centre { text-align: center; }
.muted { color: var(--muted); }
.petit { font-size: .95rem; }
p { margin: 0; }
.lien { background: none; border: 0; color: var(--muted); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 10px; justify-self: center; min-height: 44px; font-family: var(--body); font-size: 1rem; }
.ligne-btn { display: flex; gap: 10px; }
.ligne-btn > .btn { flex: 1; }
.ligne-btn > .btn-outil { flex: 0 0 auto; width: auto; padding: 6px 14px; }

/* ---------- Accueil ---------- */
.bonjour { font: 700 1.5rem var(--display); }
.sous-btn { text-align: center; color: var(--muted); font-weight: 800; margin-top: -6px; }
.tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tuile {
  position: relative; display: grid; gap: 3px; align-content: start; min-height: 112px; padding: 10px 12px 12px; text-align: left; cursor: pointer;
  border: var(--bord) solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: var(--p-ciel); color: var(--ink); font-family: var(--body);
}
.tuile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tuile .tn { font: 700 .82rem var(--display); color: var(--muted); }
.tuile .tt { font: 700 1.08rem/1.1 var(--display); }
.tuile .ex { font: 700 .82rem/1.25 var(--lecture); font-style: italic; color: var(--muted); }
.tuile .barre { height: 12px; border-width: 2px; margin-top: 4px; }
.tuile .conseil { position: absolute; top: -12px; right: -6px; }
.tuile .etoile { position: absolute; top: 6px; right: 8px; font-size: 1.1rem; }
.tuile:nth-child(6n+1) { background: var(--p-ciel); }
.tuile:nth-child(6n+2) { background: var(--p-lilas); }
.tuile:nth-child(6n+3) { background: var(--p-menthe); }
.tuile:nth-child(6n+4) { background: var(--p-soleil); }
.tuile:nth-child(6n+5) { background: var(--p-rose); }
.tuile:nth-child(6n+6) { background: var(--p-peche); }
.tuile.bonus { background: var(--surface2); }
.conseil { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; font: 800 .78rem var(--body); padding: 1px 8px; white-space: nowrap; color: var(--ink); }
.carte-lien { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; color: var(--ink); padding: 12px 14px; font-family: var(--body); }
.carte-lien:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.carte-lien .em { font-size: 28px; flex: none; width: 36px; text-align: center; }
.carte-lien .tt { font: 700 1.1rem var(--display); display: block; }
.carte-lien .st { font-size: .88rem; color: var(--muted); font-weight: 700; display: block; }
.carte-lien:disabled { opacity: .55; cursor: default; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 4px 0 6px; }
.seg button { min-height: 48px; font: 700 .95rem var(--display); color: var(--ink); background: var(--surface2); border: var(--bord) solid var(--line); border-radius: 14px; cursor: pointer; padding: 2px 4px; }
.seg button.on { background: var(--good); color: var(--on-good); }
.reglage-titre { font-weight: 800; margin-top: 6px; }

/* ---------- La phrase (mots à toucher, blocs) ---------- */
.phrase { font: 700 1.4rem/2.15 var(--lecture); text-align: center; word-spacing: .08em; }
html.grand .phrase { font-size: 1.62rem; }
.phrase .m { border-radius: 10px; padding: 3px 3px; position: relative; -webkit-user-select: none; user-select: none; }
.phrase.touchable .m.cible { cursor: pointer; }
.phrase.touchable .m.cible:active { background: var(--surface2); }
.phrase .m.verbe { background: var(--p-ciel); box-shadow: 0 0 0 3px var(--v-ciel), 0 0 0 5px var(--line); font-weight: 900; }
.phrase .m.verbe[data-num]::after {
  content: attr(data-num); position: absolute; top: -13px; right: -9px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); font: 700 .75rem/17px var(--display); text-align: center;
}
.phrase .m.sep { background: var(--p-rose); box-shadow: 0 0 0 3px var(--line); }
.phrase .m.ponct.cible { padding: 3px 8px; }
.phrase .m.faux { background: var(--tint-retry); box-shadow: 0 0 0 3px var(--retry), 0 0 0 5px var(--line); }
.phrase .m.cligne { animation: cligne-num .9s ease 2; }
@keyframes cligne-num { 50% { transform: scale(1.15); } }
.phrase .m.vue-verbe { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; font-weight: 900; }
.phrase .m.trait::before { content: ''; position: absolute; left: -14px; top: 50%; width: 12px; border-top: 3px dotted var(--line); }
/* Blocs : une partie par verbe, le séparateur entre eux */
.phrase .bloc { border-radius: 14px; padding: 4px 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.phrase .bloc.b0 { background: var(--p-ciel); }
.phrase .bloc.b1 { background: var(--p-lilas); }
.phrase .bloc.leger { background: transparent; box-shadow: inset 0 0 0 2px var(--track); }
.phrase .bloc .bloc { background: var(--p-menthe); box-shadow: inset 0 0 0 2px var(--line); padding: 2px 5px; margin: 0 2px; }
.phrase .pastille-sep { background: var(--p-rose); border: 2px solid var(--line); border-radius: 999px; padding: 1px 7px; margin: 0 2px; }
.phrase .soleil { background: var(--sun); color: var(--on-sun); border-radius: 8px; padding: 1px 3px; box-shadow: 0 0 0 2px var(--line); }
.phrase .entoure { box-shadow: 0 0 0 3px var(--retry), 0 0 0 5px var(--line); border-radius: 10px; padding: 1px 3px; }
.phrase.petite { font-size: 1.12rem; line-height: 1.85; }

/* ---------- Écran d'une phrase ---------- */
body.jeu .vjeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.haut-jeu { display: flex; align-items: center; gap: 8px; }
.points { flex: 1; display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 12px; }
.points i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--track); }
.points i.fait { background: var(--good); }
.points i.rate { background: var(--retry); }
.points i.ici { background: var(--sun); transform: scale(1.25); }
.pastille-niv { flex: none; background: var(--p-lilas); border: 2px solid var(--line); border-radius: 999px; font: 700 .8rem var(--display); padding: 1px 9px; }
.consigne { font: 700 1.12rem/1.25 var(--display); text-align: center; }
.consigne .geste { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--sun); color: var(--on-sun); border: 2px solid var(--line); font-size: .85em; margin-right: 4px; vertical-align: 1px; }
.zone {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative;
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte);
  padding: 10px 12px; display: flex; flex-direction: column;
}
.zin { margin: auto 0; display: flex; flex-direction: column; gap: 10px; }
.zone.reussie { background: var(--tint-good); }
.zone.a-retenter { background: var(--tint-retry); }
.ligne-phrase { display: flex; align-items: center; gap: 6px; }
.ligne-phrase .phrase { flex: 1; }
.rond.petit-son { width: 44px; height: 44px; font-size: 18px; flex: none; align-self: flex-start; }
.rappel { text-align: center; font-weight: 800; }
/* Bulle de test (boîte à outils) */
.bulle-test { background: var(--p-soleil); border: var(--bord) solid var(--line); border-radius: 18px; padding: 8px 10px; display: grid; gap: 6px; }
.onglets { display: flex; gap: 6px; flex-wrap: wrap; }
.onglets button { flex: 1; min-height: 44px; font: 700 .95rem var(--display); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; padding: 2px 6px; white-space: nowrap; }
.onglets button.on { background: var(--sun); color: var(--on-sun); }
.bulle-test .phrase { font-size: 1.12rem; line-height: 1.9; text-align: left; }
.bulle-test .regle { font: 700 .88rem/1.3 var(--body); color: var(--ink); }
/* Messages */
.astuce-msg { background: var(--p-soleil); border: var(--bord) solid var(--line); border-radius: 18px; padding: 8px 12px; font: 700 1.02rem/1.35 var(--body); }
.astuce-msg.bon { background: var(--p-menthe); }
.astuce-msg .phrase { font-size: 1.1rem; line-height: 1.85; text-align: left; margin-top: 4px; }
.astuce-msg i { font-style: normal; font-family: var(--lecture); font-weight: 900; }
/* Bas de l'écran */
.bas { flex: none; display: flex; flex-direction: column; gap: 8px; }
.bas .btn { min-height: 54px; }
.choix-sc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choix-sc .btn { background: var(--surface2); color: var(--ink); display: grid; align-content: center; line-height: 1.15; }
.choix-sc .btn small { font: 700 .82rem var(--body); color: var(--muted); }
.choix-sc .btn.p1 { background: var(--p-ciel); }
.choix-sc .btn.p2 { background: var(--p-lilas); }
.choix-trois { grid-template-columns: 1fr 1fr 1fr; }
.choix-trois .btn { font-size: .95rem; padding: 4px; }
/* Assembler */
.deux { display: grid; gap: 8px; }
.seps { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.seps button { min-height: 52px; min-width: 76px; padding: 4px 16px; font: 800 1.2rem var(--lecture); color: var(--ink); background: var(--p-rose); border: var(--bord) solid var(--line); border-radius: 999px; box-shadow: 0 4px 0 var(--line); cursor: pointer; }
.seps button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.seps button.on { background: var(--pompon); color: var(--on-pompon); }
.seps button.juste { background: var(--good); color: var(--on-good); }
.seps button.essaye { opacity: .5; }
/* Comparaison d'une paire */
.compare { display: grid; gap: 8px; }
.compare .phrase { font-size: 1.15rem; line-height: 1.95; }
.compare .nb { font: 800 .85rem var(--body); color: var(--muted); text-align: center; }

/* Leçons */
.lecon { display: grid; gap: 12px; }
.lecon .ecran-titre { font: 700 1.3rem var(--display); text-align: center; }
.lecon p { font-size: 1.12rem; line-height: 1.45; }
.lecon .classe { font-size: .9rem; color: var(--muted); }
.lecon .ex { background: var(--surface2); border: 2px solid var(--line); border-radius: 18px; padding: 6px 10px; }
.lecon .ex .phrase { font-size: 1.2rem; line-height: 2; }
.ex-niveau .phrase { font-size: 1.15rem; line-height: 2; }

/* ---------- Fin, carnet ---------- */
.recompense { display: grid; justify-items: center; gap: 10px; text-align: center; }
.recompense svg { width: clamp(90px, 22vh, 150px); height: clamp(90px, 22vh, 150px); overflow: visible; }
.recompense .bras, .zone .bras { transform-box: view-box; animation: coucou 2.6s ease-in-out infinite; }
.recompense .yeux, .zone .yeux { transform-box: view-box; animation: cligne 4s infinite; }
.creature-mini { width: 74px; height: 74px; overflow: visible; align-self: center; }
@keyframes coucou { 0%, 55%, 100% { transform: rotate(0); } 65% { transform: rotate(-22deg); } 75% { transform: rotate(8deg); } 85% { transform: rotate(-18deg); } 93% { transform: rotate(4deg); } }

.etoiles { font-size: 2rem; letter-spacing: .1em; }
.etoile-vole { position: fixed; z-index: 30; font-size: 26px; pointer-events: none; animation: etoile 1s ease-out forwards; }
.confetti { position: fixed; z-index: 30; width: 10px; height: 14px; border-radius: 3px; background: var(--sun); border: 1.5px solid var(--line); pointer-events: none; animation: etoile 1.4s ease-out forwards; }
.jours { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.jours i { height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--track); }
.jours i.joue { background: var(--good); }
table.stats { width: 100%; border-collapse: collapse; font-size: .95rem; }
table.stats td, table.stats th { padding: 4px 6px; border-bottom: 2px dashed var(--track); text-align: left; }
table.stats .n { text-align: right; font-weight: 800; white-space: nowrap; }
.bandeau { background: var(--p-soleil); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 800; font-size: .92rem; }

/* ---------- Dialogues ---------- */
dialog { border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte); background: var(--surface); color: var(--ink); padding: 18px; width: min(520px, calc(100% - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(20, 14, 40, .45); }
dialog h2 { margin-bottom: 8px; }
.sep-ligne { border: 0; border-top: 2px dashed var(--track); margin: 8px 0; }

/* Carte trop pleine (petit écran, phrase longue) : tout se resserre */
.zone.dense { padding: 6px 9px; }
.zone.dense .zin { gap: 6px; }
.zone.dense .phrase { font-size: 1.15rem; line-height: 1.95; }
.zone.dense .bulle-test .phrase, .zone.dense .astuce-msg .phrase { font-size: .98rem; line-height: 1.7; }
.zone.dense .astuce-msg { font-size: .9rem; padding: 6px 9px; }
.zone.dense .onglets button { min-height: 38px; font-size: .85rem; }
.zone.dense .bulle-test { padding: 6px 8px; gap: 4px; }
.zone.tres-dense .phrase { font-size: 1rem; line-height: 1.8; }
.zone.tres-dense .bulle-test .phrase, .zone.tres-dense .astuce-msg .phrase { font-size: .9rem; line-height: 1.6; }
.zone.tres-dense .astuce-msg { font-size: .84rem; }
.zone.tres-dense .bulle-test .regle { font-size: .78rem; }

/* ---------- Petits écrans ---------- */
@media (max-height: 760px) {
  body.jeu .vjeu { gap: 6px; }
  .bas .btn { min-height: 50px; }
  .consigne { font-size: 1.04rem; }
}
@media (max-height: 640px) {
  body.jeu .entete { margin-bottom: 4px; }
  body.jeu .entete .rond { width: 38px; height: 38px; font-size: 17px; }
  body.jeu .entete .titre { font-size: 1.05rem; }
  body.jeu .vjeu { gap: 5px; }
  .zone { padding: 8px 10px; }
  .bas { gap: 6px; }
  .bas .btn { min-height: 46px; font-size: 1.05rem; }
  .points i { width: 10px; height: 10px; }
  .phrase { font-size: 1.25rem; }
}
@media (max-width: 340px) {
  .tuile { padding: 8px 9px 10px; }

  .phrase { font-size: 1.22rem; }
}

/* ---------- Leçons, page d'un niveau (suite) ---------- */
.decoupe .bloc, .decoupe .pastille-sep { animation: apparait .5s var(--ressort) both; }
.decoupe .pastille-sep { animation-delay: .15s; }
.lecon-regle { font-size: 1.1rem; line-height: 1.4; text-align: center; }
.lecon .points { margin-bottom: -4px; }
.carte h3 { font: 700 1.05rem var(--display); margin-top: 4px; }
.recompense h2 { margin: 0; }
.phrase .m.ponct:not(.cible) { padding-left: 0; padding-right: 1px; margin-left: -2px; }
.tuile.bonus { grid-column: 1 / -1; min-height: 0; }
/* Tout petit écran, phrase longue et boîte ouverte : encore plus serré */
.zone.mini { padding: 4px 7px; }
.zone.mini .zin { gap: 4px; }
.zone.mini .phrase { line-height: 1.6; }
.zone.mini .bulle-test .phrase, .zone.mini .astuce-msg .phrase { font-size: .86rem; line-height: 1.5; }
.zone.mini .bulle-test .regle { display: none; }
.zone.mini .onglets button { min-height: 34px; }

  function joursJoues() { var l = [], d = auj(); for (var i = 13; i >= 0; i--) l.push(plus(d, -i)); return l; }

      '<p>' + pluriel(nj, 'jour joué', 'jours joués') + ' · ' + pluriel(nbPhrasesFaites(), 'phrase faite', 'phrases faites') + ' · ' + pluriel(aRevoir().length, 'révision due', 'révisions dues') + '</p>' +

      '<p class="muted petit">Automatique : guidé pour les 3 premières phrases d\'un niveau et après 2 phrases ratées de suite, puis la loupe, puis seul quand le niveau est réussi.</p></section>';

  function resume() {

    l.push('', 'Jours joués sur 14 : ' + jours.filter(function (d) { return J.jours[d]; }).length + ' · phrases faites : ' + nbPhrasesFaites());

    if (E.pieges.length) { l.push('', 'Pièges les plus ratés cette semaine :'); E.pieges.forEach(function (p) { l.push('- ' + p.nom + ' : ' + p.n + ' fois' + (p.ex && !/^[an]\d|^a-/.test(p.ex) ? ' (ex. ' + p.ex + ')' : '')); }); }

  function copier(t) {

  }

  /* ---------- Réglages ---------- */
  var REGLAGES = { rSon: 'son', rAnim: 'anim', rVibre: 'vibre', rVoixAuto: 'voixAuto', rLente: 'lente', rGrand: 'grand' };

  Object.keys(REGLAGES).forEach(function (id) {

  });

  /* ---------- Branchements ---------- */
  function retour() {

    if (VUE === 'vLecon' && LECON && !LECON.then && typeof LECON.n === 'number' && LECON.n > 0) return afficherNiveau(LECON.n);
    if (VUE === 'vLecon' && LECON && LECON.then && !RUN && LECON.n > 0) return afficherNiveau(LECON.n);

  function sonQ() {

  document.addEventListener('click', function (e) {

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible */ });

  /* ---------- Crochet pour les tests automatiques ---------- */
  function attendu() {
    if (!Q) return null;
    if (Q.t === 'assembler') return Object.keys(Q.x.ok);
    if (Q.t === 'couper') return Q.etape === 'toucher' ? Q.ph.limites[1].slice() : Q.etape === 'compter' ? 1 : null;

  }
  function texteDe(h) { var d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent; }
  window.__phrases = {
    M: M, PHRASES: PHRASES, ASSEMBLER: ASSEMBLER,
    etat: function () {
      return {
        vue: VUE, jour: auj(),
        lecon: LECON && { n: LECON.n, k: LECON.k, nb: LECON.ecrans.length, mini: LECON.mini },
        run: RUN && { mode: RUN.mode, k: RUN.k, n: RUN.jobs.length, jobs: RUN.jobs.map(function (j) { return j.t + (j.id ? ':' + j.id : j.piege ? ':' + j.piege : j.niv ? ':' + j.niv : '') + (j.rev ? ':rev' : '') + (j.aide ? ':' + j.aide : ''); }) },

        if (k < 0) k = pick(function (w) { return w.k === 'mot' && w.v < 0; });
        Q.lit[k] = true; return validerVerbes();
      }
      if (g === 2) return choisirSC(attendu() === 'simple' ? 'complexe' : 'simple');
      if (g === 3) {

        if (j < 0) j = pick(function (w) { return w.k === 'mot' && !w.s && w.prof === 0; });
        Q.seps = {}; Q.seps[j] = true; return validerSep();

<!-- Compteur de visites anonyme (GoatCounter) : compte seulement les ouvertures de la page,
     sans cookie, sans nom, sans rien sur la progression. Hors connexion, rien n'est envoyé.
     Pour ne pas compter un appareil : ouvrir une fois l'adresse avec #sans-compteur à la fin
     (#avec-compteur pour annuler). -->
<script>
(function () {
  try {
    var cle = 'marc.sans-compteur';
    try {
      if (location.hash === '#sans-compteur') localStorage.setItem(cle, 'oui');
      if (location.hash === '#avec-compteur') localStorage.removeItem(cle);
      if (/^#(sans|avec)-compteur$/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
      if (localStorage.getItem(cle) === 'oui') return;
    } catch (e) {}
    if (location.hostname !== 'lechampdelaurore-boop.github.io' || navigator.webdriver || !navigator.onLine || !navigator.sendBeacon) return;
    var q = 'p=' + encodeURIComponent(location.pathname) +
      '&t=' + encodeURIComponent(document.title) +
      '&r=' + encodeURIComponent(document.referrer) +
      '&s=' + encodeURIComponent(screen.width + ',' + screen.height + ',' + (window.devicePixelRatio || 1)) +
      '&rnd=' + Math.random().toString(36).slice(2);
    navigator.sendBeacon('https://lechampdelaurore.goatcounter.com/count?' + q);
  } catch (e) {}
})();
</script>
